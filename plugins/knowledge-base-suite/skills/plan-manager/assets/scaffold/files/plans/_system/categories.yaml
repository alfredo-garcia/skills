outdoor: { label: Naturaleza y excursión, type: adventure }
cinema: { label: Cine, type: culture }
theater: { label: Teatro, type: culture }
concert: { label: Concierto, type: music }
festival: { label: Festival, type: music }
fair: { label: Feria, type: other }                # ferias de emprendimiento, comerciales…
exhibition: { label: Exposición o museo, type: culture }
workshop: { label: Taller o curso, type: culture }
sport-event: { label: Evento deportivo, type: sport }
trip-day: { label: Escapada de un día, type: adventure }
other: { label: Otro, type: other }
nightlife: { label: Fiesta y rumba, type: music }   # bares de noche, discotecas, salidas de fiesta
game-night: { label: Noche de juegos, type: home }   # póker, juegos de mesa, videojuegos en casa
